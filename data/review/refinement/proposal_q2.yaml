# Rascunho para revisão dos pesquisadores; não é a configuração ativa.
version: 2

domain:
  terms:
    - "retrieval augmented generation"
    - "retrieval-augmented generation"

families:

  S1:
    stage: sources
    label: Fontes
    terms:
      - "data source*"
      - "knowledge source*"
      - "source selection"
      - "source curation"
      - "corpus curation"

  S2:
    stage: ingestion
    label: Ingestão
    terms:
      - "data ingestion"
      - "document ingestion"
      - "data extraction"
      - "document parsing"
      - "OCR"
      - "crawl*"

  S3:
    stage: storage
    label: Armazenamento
    terms:
      - "vector database*"
      - "vector store*"
      - "vector index*"
      - "document store*"
      - "embedding store*"

  S4:
    stage: preparation
    label: Preparação
    terms:
      - "chunk*"
      - "text segment*"
      - "document split*"
      - "text preprocessing"
      - "document preprocessing"
      - "text normalization"
      - "embedding generation"

  S5:
    stage: serving
    label: Disponibilização
    terms:
      - "retrieval strateg*"
      - "hybrid search"
      - "hybrid retrieval"
      - "rerank*"
      - "metadata filter*"
      - "context compression"

  S6:
    stage: usage_feedback
    label: Uso e feedback
    terms:
      - "RAG evaluation"
      - "retrieval evaluation"
      - "observab*"
      - "tracing"
      - "user feedback"

  S7:
    stage: maintenance
    label: Manutenção
    terms:
      - "freshness"
      - "reindex*"
      - "document update*"
      - "corpus update*"
      - "incremental update*"
      - "version*"

  S8:
    stage: disposal
    label: Descarte
    terms:
      - "data deletion"
      - "document deletion"
      - "deindex*"
      - "erasure"
      - "retention"
      - "purge"
      - "expiration"
